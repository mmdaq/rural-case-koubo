# ============================================================
# 农村集体资产案例口播文案机器人 - 主配置
# 敏感信息（邮箱授权码、API Key）请填入 .env，本文件只写非敏感配置
# ============================================================

schedule:
  # 每日执行时间（24小时制），默认早上 8 点
  time: "08:00"
  timezone: "Asia/Shanghai"

mail:
  # 发件邮箱 SMTP 配置（QQ 邮箱默认值）
  smtp_host: "smtp.qq.com"
  smtp_port: 465
  use_ssl: true
  # 发件人邮箱（必填）
  sender: "your_account@qq.com"
  # 收件人列表（必填，可多个）
  receivers:
    - "385096659@qq.com"
  subject_prefix: "【农村集体案例口播】"

llm:
  # 文案生成：deepseek / openai / none
  # none 或未配置 api_key 时自动降级为本地模板引擎
  provider: "deepseek"
  api_key: ""                # 建议放 .env: LLM_API_KEY=xxx
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  temperature: 0.8
  timeout: 60

collector:
  # 每日采集上限（候选池截断上限；实际池子 < 50 时全部返回，不截断）
  max_cases_per_day: 100
  # 采集数据源开关（全部失败时自动使用内置种子案例）
  sources:
    rmfyalk: true            # 人民法院案例库官网（需登录态，通常失败）
    court_gov: true          # 最高人民法院官网涉农案例
    search_web: true         # 搜索引擎检索人民法院案例库转载
  # 内置种子案例兜底（含已核实的真实案例）
  use_fallback: true
  # 检索关键词（围绕农村/集体资产）
  keywords:
    - "侵害集体经济组织成员权益 人民法院案例库"
    - "外嫁女 征地补偿 人民法院案例库"
    - "农村集体收益分配 案例库 判决"
    - "村规民约 集体经济组织成员 案例"
    - "集体经营性建设用地 收益分配 案例库"
    - "入赘婿 集体经济组织成员资格 案例库"
    - "离婚妇女 征地补偿款 人民法院案例库"
    - "最高人民法院 涉农民事典型案例"

generator:
  # 每天生成的文案篇数
  count_per_day: 5
  # 冷却期（天）：同一案例推送后，N 天内不再选入每日5篇
  # 注意：当前设置为仅推送未推送过的案例，冷却期参数已失效
  cooldown_days: 7
  # 最小间隔（天）：案例池不足时的最后兜底，也不得复用最近 N 天推送过的案例
  # 注意：当前设置为仅推送未推送过的案例，此参数已失效
  min_gap_days: 1
  # 输出目录
  output_dir: "data/output"
  # 是否在邮件中附带文案 markdown 附件
  attach_file: true

notify:
  # 连续无新增案例时的最大通知天数（超过后停止推送）
  max_notify_days: 3

verify:
  # 真伪核查：同一案例至少出现在几个独立域名来源才算可信
  min_independent_sources: 1
  # 入库编号格式校验开关
  check_rule_code: true
  # 严格模式：未通过核查的案例一律丢弃，不再"带病推送"
  strict: true
  # 官方可查锚点必检：官方链接（案例库/最高院/政府法院官网）
  # 或 入库编号+裁判文书号，或 入库编号+≥2个独立来源，三选一
  require_official_anchor: true
  # 官网在线核对：入库编号必须在人民法院案例库官网（rmfyalk.court.gov.cn）
  # 检索得到才允许推送。Token 从环境变量 RMFYALK_TOKEN 读取（GitHub Secrets 配置）。
  online:
    # 官网核对服务不可用（Token 失效/网络异常）时是否终止任务：
    # true  = 宁可当天不发，也不推送未经官网核对的文案（Token 一过期就会整轮停发）
    # false = 降级为锚点校验并告警，保证每天仍能正常发送（推荐；Token 有效时仍逐案强制核对）
    require: false
    timeout: 20

storage:
  # 已推送案例去重库
  seen_file: "data/seen_cases.json"
  # 自动探索发现的新案例扩展库（每日累积）
  extra_file: "data/extra_cases.json"
  # 已抓取 URL 记录（每日只抓新页面，持续扩容）
  crawled_file: "data/crawled_urls.json"
  # 运行状态：连续无新增天数 / 停止标记
  state_file: "data/run_state.json"
